name: Release

# Tag-driven release: pushing vX.Y.Z runs the checks, publishes to npm with
# provenance via npm Trusted Publishing (OIDC — no NPM_TOKEN), and creates a
# GitHub Release. The tag must equal the version in package.json.
on:
  push:
    tags:
      - "v*"

# Trusted publishing needs the OIDC token; the GitHub Release needs contents.
permissions:
  contents: write
  id-token: write

concurrency:
  group: release-${{ github.ref_name }}
  cancel-in-progress: false

jobs:
  publish:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 24
          cache: npm

      # Trusted publishing requires npm >= 11.5.1
      - name: Upgrade npm
        run: npm install -g npm@latest && npm --version

      - name: Install
        run: npm ci

      - name: Tag matches package.json version
        run: |
          version=$(node -p "require('./package.json').version")
          if [ "v$version" != "$GITHUB_REF_NAME" ]; then
            echo "::error::tag $GITHUB_REF_NAME does not match package.json version v$version"
            exit 1
          fi

      - name: Build (typecheck) and test
        run: npm run check

      # No NODE_AUTH_TOKEN and no registry-url on purpose: npm exchanges the
      # GitHub OIDC token for short-lived credentials, derived from the
      # trusted publisher configured for this repo + this workflow file.
      - name: Publish to npm
        run: npm publish --provenance --access public

      - name: GitHub Release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --verify-tag --generate-notes --title "$GITHUB_REF_NAME"
